name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.423
            10.0.302

      - run: dotnet tool restore
      - run: dotnet restore Requisite.sln --locked-mode
      - run: dotnet fantomas src tests/Requisite.Tests/*.fs tests/compiler-contracts examples --check
        shell: bash
      - run: dotnet build Requisite.sln --configuration Release --no-restore
      - run: dotnet test tests/Requisite.Tests/Requisite.Tests.fsproj -f net8.0 --configuration Release --no-build
      - run: dotnet test tests/Requisite.Tests/Requisite.Tests.fsproj -f net10.0 --configuration Release --no-build
      - run: dotnet run --project examples/PaymentFlow/PaymentFlow.fsproj -f net8.0 --configuration Release --no-build
      - run: dotnet run --project examples/PaymentFlow/PaymentFlow.fsproj -f net10.0 --configuration Release --no-build

  package:
    name: Package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302

      - run: dotnet tool restore
      - run: dotnet restore Requisite.sln --locked-mode
      - run: dotnet build src/Requisite/Requisite.fsproj --configuration Release --no-restore
      - run: dotnet pack src/Requisite/Requisite.fsproj --configuration Release --no-build
      - run: dotnet sourcelink test src/Requisite/bin/Release/netstandard2.0/Requisite.pdb
      - run: dotnet sourcelink test src/Requisite/bin/Release/net8.0/Requisite.pdb
      - run: dotnet sourcelink test src/Requisite/bin/Release/net10.0/Requisite.pdb
      - run: |
          unzip -l artifacts/packages/Requisite.FSharp.*.nupkg
          unzip -l artifacts/packages/Requisite.FSharp.*.snupkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: requisite-packages
          path: artifacts/packages/*
          if-no-files-found: error
